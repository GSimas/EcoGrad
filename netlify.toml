# Fica na RAIZ do repositório, não em `ecograd-web/`.
# A CLI da Netlify resolve `base`, o diretório de funções e o `.env` a partir
# da raiz do repositório git; com o arquivo dentro de `ecograd-web/` o
# `netlify dev` não encontra nem as funções nem as variáveis de ambiente.
# Todos os caminhos abaixo são relativos a `base`.
[build]
  base    = "ecograd-web"
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "24"
  # O scanner de segredos da Netlify falha o build quando acha o valor de uma
  # variável de ambiente no repositório ou no que foi compilado. Estas duas são
  # públicas por desenho, e o próprio prefixo `VITE_` diz isso: o Vite grava o
  # valor dentro do JS que vai ao navegador, então é impossível que não estejam
  # no build — e o `.env.example` documenta a URL de propósito. A chave é a
  # publicável (`anon`), com RLS somente leitura e nenhuma tabela de escrita
  # alcançável; o segredo do índice é a `service_role`, que nunca entra aqui.
  #
  # Omitir só estas duas, e não desligar o scanner: DEEPSEEK_API_KEY,
  # GEMINI_API_KEY, NEO4J_PASSWORD e SUPABASE_DB_URL são segredos de verdade e continuam
  # vigiados.
  SECRETS_SCAN_OMIT_KEYS = "VITE_INDICE_URL,VITE_INDICE_CHAVE"

[functions]
  # `directory` é lido pelo runtime atual do Netlify Dev; o `functions` em
  # [build] atende versões mais antigas da CLI. Ambos relativos a `base`.
  directory = "netlify/functions"
  node_bundler = "esbuild"
  # O chat usa streaming (ReadableStream) — exige runtime Node 18+

[dev]
  # O Netlify Dev executa este comando a partir da RAIZ do repositório (não de
  # `base`), por isso o caminho completo do script. O wrapper define `PORT`, que
  # alimenta tanto `server.port` quanto `server.hmr.clientPort` no vite.config —
  # sem esse alinhamento o WebSocket de HMR tenta a porta do proxy e o
  # hot-reload para de funcionar. O prefixo POSIX `PORT=5176 npm ...` não serve
  # aqui: a CLI roda o comando pelo shell do sistema e o `cmd.exe` do Windows
  # trataria `PORT=5176` como nome de executável.
  # Ajuste `PORTA_VITE` (em scripts/dev-vite.mjs) e `targetPort` juntos se 5176
  # estiver ocupada.
  command = "node ecograd-web/scripts/dev-vite.mjs"
  targetPort = 5176
  port = 8888
  framework = "#custom"
  autoLaunch = false

# --- Rotas SPA: tudo que não for arquivo/função cai no index.html ---
# `/.netlify/functions/*` já é servido nativamente — não precisa (nem aceita)
# uma regra de redirect própria.
[[redirects]]
  from = "/api/*"
  to   = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to   = "/index.html"
  status = 200

# --- Headers de cache/compressão para os dados estáticos ---
[[headers]]
  for = "/data/colecao-*.json.gz"
  [headers.values]
    Content-Type = "application/gzip"
    Content-Encoding = "identity"
    Cache-Control = "public, max-age=31536000, immutable"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/data/busca-*.json.gz"
  [headers.values]
    Content-Type = "application/gzip"
    Content-Encoding = "identity"
    Cache-Control = "public, max-age=31536000, immutable"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/data/orientacoes-*.json.gz"
  [headers.values]
    Content-Type = "application/gzip"
    Content-Encoding = "identity"
    Cache-Control = "public, max-age=31536000, immutable"
    Access-Control-Allow-Origin = "*"

# Bases completas de nome fixo são legadas; não podem ser immutable.
[[headers]]
  for = "/data/base_*.json.gz"
  [headers.values]
    Content-Type = "application/gzip"
    Content-Encoding = "identity"
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/data/*.json"
  [headers.values]
    Content-Type = "application/json; charset=utf-8"
    Cache-Control = "public, max-age=0, must-revalidate"

# JS, CSS, fontes e workers do Vite: o nome carrega o hash do conteúdo, então
# uma versão nova é sempre outro arquivo e o antigo pode ficar em cache para sempre.
# Compressão: a Netlify entrega Brotli (ou gzip, se o navegador não aceitar
# Brotli) automaticamente para texto — HTML, JS, CSS, JSON, SVG — e não há o que
# configurar aqui. Os `.json.gz` acima ficam de fora de propósito: já são gzip.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Segurança básica em todas as respostas. `DENY`: nenhuma página do EcoGrad é
# exibida dentro de frame, nem da própria origem — o app não se emoldura (o
# visualizador de PDF emoldura o repositório da UFSC, não o contrário).
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
