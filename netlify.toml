# Fica na RAIZ do repositório, não em `ecograd-web/`.
# A CLI da Netlify resolve `base`, o diretório de funções e o `.env` a partir
# da raiz do repositório git; com o arquivo dentro de `ecograd-web/` o
# `netlify dev` não encontra nem as funções nem as variáveis de ambiente.
# Todos os caminhos abaixo são relativos a `base`.
[build]
  base    = "ecograd-web"
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  # `directory` é lido pelo runtime atual do Netlify Dev; o `functions` em
  # [build] atende versões mais antigas da CLI. Ambos relativos a `base`.
  directory = "netlify/functions"
  node_bundler = "esbuild"
  # O chat usa streaming (ReadableStream) — exige runtime Node 18+
  external_node_modules = ["neo4j-driver"]

[dev]
  # O Netlify Dev executa este comando a partir da RAIZ do repositório (não de
  # `base`), por isso o `--prefix`. O `PORT` alimenta tanto `server.port` quanto
  # `server.hmr.clientPort` no vite.config — sem esse alinhamento o WebSocket de
  # HMR tenta a porta do proxy e o hot-reload para de funcionar.
  # Ajuste `PORT` e `targetPort` juntos se 5176 estiver ocupada.
  command = "PORT=5176 npm --prefix ecograd-web run dev"
  targetPort = 5176
  port = 8888
  framework = "#custom"
  autoLaunch = false

# --- Rotas SPA: tudo que não for arquivo/função cai no index.html ---
# `/.netlify/functions/*` já é servido nativamente — não precisa (nem aceita)
# uma regra de redirect própria.
[[redirects]]
  from = "/api/*"
  to   = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to   = "/index.html"
  status = 200

# --- Headers de cache/compressão para os dados estáticos ---
[[headers]]
  for = "/data/*.json.gz"
  [headers.values]
    Content-Type = "application/gzip"
    Content-Encoding = "identity"
    Cache-Control = "public, max-age=31536000, immutable"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/data/*.json"
  [headers.values]
    Content-Type = "application/json; charset=utf-8"
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
